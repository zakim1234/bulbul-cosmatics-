<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Bulbul Cosmetics">
  <defs>
    <linearGradient id="bc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a1446"/>
      <stop offset="0.55" stop-color="#9d1d5c"/>
      <stop offset="1" stop-color="#e05a8f"/>
    </linearGradient>
    <linearGradient id="bc-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e2b3"/>
      <stop offset="0.5" stop-color="#d9ab5b"/>
      <stop offset="1" stop-color="#b5853a"/>
    </linearGradient>
    <linearGradient id="bc-bird" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8f1"/>
      <stop offset="1" stop-color="#fbdbe7"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="58" fill="url(#bc-bg)"/>
  <circle cx="60" cy="60" r="52.5" fill="none" stroke="url(#bc-gold)" stroke-width="1.6"/>

  <!-- branch -->
  <path d="M24 88 C44 80 70 80 98 92" fill="none" stroke="url(#bc-gold)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M36 84 C33 77 36 72 42 71 C43 77 41 81 36 84 Z" fill="url(#bc-gold)"/>
  <path d="M86 86 C88 79 93 77 98 79 C96 85 92 87 86 86 Z" fill="url(#bc-gold)"/>

  <!-- rose bud -->
  <circle cx="30" cy="66" r="6.2" fill="#f7b6cd"/>
  <path d="M26.5 64.5 C28 61 33 61 34 65 C31.5 63.5 29 63.5 26.5 64.5 Z" fill="#e05a8f"/>
  <path d="M30 72 C30.5 76 33 80 36 84" fill="none" stroke="url(#bc-gold)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- bulbul -->
  <path d="M38 43 L47.5 39.6 C50 31 61 28.5 67 35.5 C74 43.5 80 53 84.5 62 L99 79.5 L92.5 83.5 L80.5 74.5 C72 79.5 60 80.5 52.5 74.5 C44.5 68 42.5 56.5 46.5 47 Z" fill="url(#bc-bird)"/>
  <!-- crest -->
  <path d="M52.5 35 C53 27.5 57.5 22.5 63.5 20.5 C61 25 61.2 29.5 65 35 Z" fill="url(#bc-bird)"/>
  <!-- wing -->
  <path d="M57 50 C68 48.5 79 57.5 83.5 69.5 C74.5 67.5 64 62.5 57 55.5 Z" fill="url(#bc-gold)"/>
  <path d="M61 55 C68 56 74 60.5 78 65.5" fill="none" stroke="#9d1d5c" stroke-opacity="0.35" stroke-width="1"/>
  <!-- cheek & eye -->
  <circle cx="53.5" cy="45" r="3.6" fill="#e05a8f" fill-opacity="0.75"/>
  <circle cx="51.6" cy="39.4" r="1.9" fill="#3b0a2c"/>
  <circle cx="52.1" cy="38.9" r="0.6" fill="#ffffff"/>
  <!-- legs -->
  <path d="M60 79 L59 84.5 M66 79.5 L66.5 85" stroke="url(#bc-gold)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- sparkles -->
  <path d="M86 30 L87.4 34.6 L92 36 L87.4 37.4 L86 42 L84.6 37.4 L80 36 L84.6 34.6 Z" fill="url(#bc-gold)"/>
  <path d="M96 48 L96.7 50.3 L99 51 L96.7 51.7 L96 54 L95.3 51.7 L93 51 L95.3 50.3 Z" fill="#f6e2b3"/>
</svg>
